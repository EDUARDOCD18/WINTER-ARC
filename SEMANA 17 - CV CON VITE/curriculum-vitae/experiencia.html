<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experiencia Laboral y Proyectos Ejecutados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main class="main-content container" id="app">
      <!-- SECCIÓN 1: Trayectoria Laboral -->
      <section class="work-section">
        <h1 class="main-subtitle">Trayectoria Profesional</h1>
        <p class="section-lead">
          Experiencia técnica en soporte de infraestructura de internet, gestión
          de redes y operaciones de campo.
        </p>

        <!-- Contenedor dinámico de experiencia -->
        <div class="work-timeline" id="experience-timeline"></div>
      </section>

      <!-- SECCIÓN 2: Showroom de Proyectos -->
      <section class="projects-section">
        <h2 class="projects-section__title">Proyectos de Desarrollo</h2>
        <p class="section-lead text-center">
          Soluciones web e interfaces construidas aplicando ingeniería front-end
          avanzada.
        </p>

        <!-- Contenedor dinámico de proyectos -->
        <div class="project-grid" id="projects-grid"></div>
      </section>
    </main>
  </body>
</html>
